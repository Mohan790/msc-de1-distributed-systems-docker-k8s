# --- Non-sensitive configuration -----------------------------------------
# Referenced by k8s/deployment.yaml via envFrom. Add real config keys here
# as the app grows; never put secrets in a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-app-config
  namespace: msc-de1-project
data:
  FLASK_ENV: "production"
  LOG_LEVEL: "info"

---
# --- Secret TEMPLATE (do NOT put real values here / do NOT commit real values) ---
# This file only ships placeholder values. If your implementation ever
# needs a real secret, create it out-of-band instead, e.g.:
#
#   kubectl create secret generic flask-app-secret \
#     --namespace msc-de1-project \
#     --from-literal=EXAMPLE_API_KEY='replace-me'
#
# and reference it from the Deployment with `envFrom.secretRef` — never
# commit the real secret value to GitHub.
apiVersion: v1
kind: Secret
metadata:
  name: flask-app-secret
  namespace: msc-de1-project
type: Opaque
stringData:
  EXAMPLE_API_KEY: "replace-me-do-not-commit-real-value"
