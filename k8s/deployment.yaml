apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: msc-de1-project
  labels:
    app: flask-app
    project: msc-de1-distributed-systems
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: flask-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: flask-app
        project: msc-de1-distributed-systems
    spec:
      # Pod-level security context: applies to all containers in the pod.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: flask-app
          # Replace <dockerhub-username> with your Docker Hub username and
          # keep this tag in sync with the version documented in the README.
          image: <dockerhub-username>/msc-de1-flask-app:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: flask-app-config

          # --- Container-level security context ---------------------
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # --- Probes --------------------------------------------------
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3

          # --- Resource awareness ---------------------------------------
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"

          # gunicorn needs a small writable directory even though the app
          # itself is stateless; this keeps readOnlyRootFilesystem: true
          # workable without weakening the image.
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      # No hostPath volumes, no host networking, no host PID/IPC — the
      # pod spec simply never sets hostNetwork/hostPID/hostIPC, and no
      # hostPath volume is declared above.
